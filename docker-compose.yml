services:

  mongodb:
    image: mongo:latest
    container_name: monitorx-mongodb
    ports:
      - "27017:27017"
    restart: always

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: monitorx-redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:management
    container_name: monitorx-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  api-gateway:
    image: nginx:latest
    container_name: monitorx-gateway
    ports:
      - "8080:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mongodb
      - redis
      - rabbitmq
    restart: always

volumes:
  mongodb_data:
