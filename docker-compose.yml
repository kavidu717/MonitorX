services:

  mongodb:
    image: mongo:latest
    container_name: monitorx-mongodb
    ports:
      - "27017:27017"
    restart: always

    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: monitorx-redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:management
    container_name: monitorx-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
volumes:
  mongodb_data:
